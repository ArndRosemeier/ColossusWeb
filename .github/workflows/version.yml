name: Version bump

# Every pull request into master must add one "What's new" entry, raising the
# version by exactly 0.01. See AGENTS.md, "Versioning".
on:
  pull_request:
    branches: [master]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}
